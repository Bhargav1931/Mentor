{% extends 'base.html' %}{% block content %}<h1>{{ title }}</h1><div class="grid">{% for r in relationships %}<article><h2>{{ r.mentor.name }} &amp; {{ r.mentee.name }}</h2><span class="badge">{{ r.status }}</span><p>{{ r.goals }}</p><a class="button" href="{% url 'workspace' r.pk %}">Open workspace / chat</a></article>{% empty %}<article>No conversations yet. Send or accept a <a href="{% url 'requests' %}">mentorship request</a> first.</article>{% endfor %}</div>{% endblock %}
