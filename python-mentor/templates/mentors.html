{% extends 'base.html' %}{% block content %}<h1>Find mentors</h1><form method="get"><label for="q">Search by name or skill</label><input id="q" name="q" value="{{ query }}"><button>Search</button></form><div class="grid">{% for mentor in mentors %}<article><h2>{{ mentor.name }}</h2><p>{{ mentor.headline }}</p><p>{{ mentor.skills }}</p><a href="{% url 'mentor' mentor.pk %}">View mentor →</a></article>{% empty %}<p>No mentors found. Add a mentor from Members or ask them to register.</p>{% endfor %}</div>{% endblock %}
