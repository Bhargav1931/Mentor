<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MentorBridge</title><style>
:root{font-family:system-ui,sans-serif;color:#172033;background:#f5f7fc}*{box-sizing:border-box}body{margin:0}header{background:white;border-bottom:1px solid #dde3ef;padding:18px 5%;display:flex;align-items:center;flex-wrap:wrap;gap:22px}a{color:#493acb;text-decoration:none}nav{display:flex;gap:16px;flex-wrap:wrap;align-items:center}.brand{font-size:22px;font-weight:800}main{max-width:1100px;margin:36px auto;padding:0 22px}h1{font-size:36px}h2{font-size:23px}p{line-height:1.6}article,.card{background:white;padding:24px;border:1px solid #e0e5ef;border-radius:16px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px}.grid article{margin:0}button,.button{display:inline-block;border:0;background:#5143d7;color:white;border-radius:8px;padding:11px 17px;font:inherit;cursor:pointer}input,textarea,select{display:block;width:100%;max-width:650px;padding:11px;margin:7px 0 16px;border:1px solid #bfc8d8;border-radius:7px;font:inherit}label{font-weight:600}.helptext{display:block;color:#627087;font-size:13px}.errorlist{color:#b42335}.muted{color:#627087}.badge{font-size:12px;padding:4px 9px;background:#eef0ff;border-radius:20px}.notice{background:#e7f4ee;padding:15px;border-radius:8px}.inline{display:inline}.inline button{padding:7px 12px}.message{white-space:pre-wrap;border-left:3px solid #6955dd;padding:10px 16px;background:#f5f4ff;margin:12px 0}.hero{padding:40px 0}small{color:#627087}form ul{max-width:650px}.sections{display:grid;grid-template-columns:1fr 1fr;gap:22px}@media(max-width:700px){.sections{grid-template-columns:1fr}h1{font-size:29px}}
</style></head><body><header><a class="brand" href="/">MentorBridge</a><nav>{% if user.is_authenticated %}<a href="{% url 'dashboard' %}">Dashboard</a><a href="{% url 'members' %}">Members</a><a href="{% url 'mentors' %}">Mentors</a><a href="{% url 'requests' %}">Requests</a><a href="{% url 'relationships' %}">Mentorships</a><a href="{% url 'schedule' %}">Schedule</a><a href="{% url 'chat' %}">Chat</a><a href="{% url 'profile' %}">Profile</a><form class="inline" method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Log out</button></form>{% else %}<a href="{% url 'login' %}">Log in</a><a class="button" href="{% url 'register' %}">Get started</a>{% endif %}</nav></header><main>{% for message in messages %}<p class="notice" role="status">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main></body></html>
